  <!-- Keyhole / zero-knowledge seal -->
  <circle cx="22" cy="15.2" r="2.7" fill="url(#vsBrand)"/>

  <!-- Bold V for VeriStasis -->
  <path d="M13.4 19.6 L22 34 L30.6 19.6"
        fill="none" stroke="url(#vsBrand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
